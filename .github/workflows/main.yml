name: Build Dariush VPN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Dariush builder
        uses: actions/checkout@v4

      - name: Clone pinned v2rayNG source
        run: |
          git clone \
            --depth 1 \
            --branch 2.2.6 \
            --recurse-submodules \
            https://github.com/2dust/v2rayNG.git upstream

      - name: Apply Dariush customization
        run: |
          python3 patch/apply_patch.py upstream

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install "ndk;29.0.14206865"

          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build libhevtun
        working-directory: upstream
        run: |
          chmod +x compile-hevtun.sh
          bash compile-hevtun.sh

          mkdir -p V2rayNG/app/libs

          if [ -d "libs" ]; then
            cp -r libs/* V2rayNG/app/libs/ || true
          fi

      - name: Find matching AndroidLibXrayLite release
        run: |
          CURRENT_TAG=$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)

          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"

          echo "AndroidLibXrayLite version:"
          echo "$CURRENT_TAG"

      - name: Download matching libv2ray AAR
        uses: robinraju/release-downloader@v1.11
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Prepare Gradle
        working-directory: upstream/V2rayNG
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Build Dariush APK
        working-directory: upstream/V2rayNG
        run: |
          ./gradlew \
            assembleFdroidDebug \
            -PABI_FILTERS=arm64-v8a \
            --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find upstream/V2rayNG/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

      - name: Collect APK
        run: |
          mkdir -p output

          APK_FILE=$(find upstream/V2rayNG/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | grep -i "arm64" \
            | head -n 1)

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find upstream/V2rayNG/app/build/outputs/apk \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK_FILE" ]; then
            echo "APK not found"
            exit 1
          fi

          echo "Using APK:"
          echo "$APK_FILE"

          cp "$APK_FILE" output/DariushVPN.apk

      - name: Upload Dariush APK
        uses: actions/upload-artifact@v4
        with:
          name: DariushVPN-APK
          path: output/DariushVPN.apk
          if-no-files-found: error
