name: Build OneTap VPN APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OneTap builder
        uses: actions/checkout@v7

      - name: Clone pinned v2rayNG source
        run: |
          git clone --depth 1 --branch 2.2.6 --recurse-submodules https://github.com/2dust/v2rayNG.git upstream

      - name: Apply OneTap customization
        run: python3 patch/apply_patch.py upstream

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          sed -i '10i\\
          \\
              ndkVersion = "29.0.14206865"' upstream/V2rayNG/app/build.gradle.kts

      - name: Build libhevtun
        working-directory: upstream
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Find matching AndroidLibXrayLite release
        run: |
          CURRENT_TAG=$(git -C upstream/AndroidLibXrayLite describe --tags --abbrev=0)
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "Using AndroidLibXrayLite $CURRENT_TAG"

      - name: Download matching libv2ray AAR
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: upstream/V2rayNG/app/libs/

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build installable debug APK (arm64)
        working-directory: upstream/V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug -PABI_FILTERS=arm64-v8a

      - name: Collect APK
        run: |
          mkdir -p output
          find upstream/V2rayNG/app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -exec cp {} output/OneTapVPN-arm64-v8a.apk \;
          test -f output/OneTapVPN-arm64-v8a.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: OneTapVPN-arm64-v8a
          path: output/OneTapVPN-arm64-v8a.apk
          if-no-files-found: error
